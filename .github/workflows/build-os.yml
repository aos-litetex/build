name: Build OS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, type-cpx51, in-hel1, image-x86-app-docker-ce]
    steps:
    - uses: actions/checkout@v4

    - name: Checkout signing keys # For now a repo as there a dozens of files that are kind of hard to store as a GitHub secret
      uses: actions/checkout@v4
      with:
        repository: aos-litetex/build-signing-keys
        token: ${{ secrets.SIGNING_KEY_CHECKOUT_GH_TOKEN }}
        path: user/keys

    - name: Cache CCache
      uses: actions/cache@v4
      with:
        path: user/ccache
        key: ccache
    
    - name: Build OS using Docker
      run: docker compose -f ci.docker-compose.yml up

    - name: Archive logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs
        path: user/logs

    - run: ls -lha user/zips

    - name: Archive system image
      uses: actions/upload-artifact@v4
      with:
        name: zips
        path: user/zips/**/system.img

    # TODO: Apply customization from huawei-creator
